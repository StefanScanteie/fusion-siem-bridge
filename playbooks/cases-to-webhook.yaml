apiVersion: v0.0.1
kind: Playbook
name: FusionSIEMCasesToWebhook
version: 1.0.1
title: Fusion SIEM — cases and related events to webhook
description: Post Case inputs to the fusion-siem-bridge webhook URL
documentation: |
  Cases are not in Custom Webhook v1.0.1 (Alert2 only). Catalog Send to Webhook
  posts raw case trigger inputs with no Event.resolve. This playbook keeps the
  Case Sync trigger/CEL helpers and attaches resolved events, mapping into
  Taegis.Webhook.post's {alert, events} slots.

  1. Reuse the Generic Webhook connection from detections.
     URL: https://<collector>/v1/ingest?token=<FUSION_SIEM_INGEST_TOKEN>
     Taegis.Webhook.post does not send an Authorization header.
  2. Platform trigger: source case. Recommended events: Create, Update, Delete,
     Events Added. Official Case Sync also lists detection/asset/comment/file
     events — add those if the SIEM should see every case mutation.
  3. Recommended filter: caseSeverity(inputs) in ['High', 'Critical']
  4. Taegis.Webhook.post only accepts {alert, events}. This playbook puts a
     synthetic alert with type: case in the alert slot so the collector can
     distinguish cases from Alert2 detections.

  CEL helpers (from official Case Sync triggerHints): caseId, caseTitle,
  caseSeverity, casePriority, caseTenantId, caseKeyFindings, caseType,
  caseStatus, caseEventEvidence, createShareLink, inputs.event.
connectorCategories:
  - Generic
connectors:
  - Taegis.Case:1.0.2
  - Taegis.Event:1.0.10
  - Taegis.Webhook:1.0.0
triggerHints:
  - isProactiveResponse: false
    type: platform
    config:
      events:
        - Create
        - Update
        - Delete
        - Events Added
        - Events Removed
      filter: caseSeverity(inputs) in ['High', 'Critical']
      source: case
    celHints:
      - name: High or Critical Cases
        expr: caseSeverity(inputs) in ['High', 'Critical']
      - name: Security Cases
        expr: caseType(inputs) == 'SECURITY_CASE'
      - name: Closed Cases
        expr: isCaseClosed(inputs)
      - name: Has Event Evidence
        expr: size(caseEventEvidence(inputs)) > 0
      - name: Tenant Is One Of
        expr: caseTenantId(inputs) in ['12345']
inputs:
  type: object
outputs:
  type: object
dsl:
  name: webhook
  tasks:
    - name: loop_over_case_events
      variables:
        results: []
      range: caseEventEvidence(inputs)
      for:
        - name: fetch_event_details
          action: Taegis.Event.resolve
          inputs:
            id: loop_over_case_events.value
    - name: webhook_post
      action: Taegis.Webhook.post
      inputs:
        alert:
          type: case
          resource_id: caseId(inputs)
          tenant_id: caseTenantId(inputs)
          status: caseStatus(inputs)
          metadata:
            title: caseTitle(inputs)
            description: caseKeyFindings(inputs)
          case_severity: caseSeverity(inputs)
          case_priority: casePriority(inputs)
          case_type: caseType(inputs)
          url: createShareLink(inputs)
          playbook_event: inputs.?event.orValue('')
        events: loop_over_case_events.outputs
type: None
