apiVersion: v0.0.1
kind: Playbook
name: FusionSIEMDetectionsToWebhook
version: 1.0.1
title: Fusion SIEM — detections and related events to webhook
description: Post Alert2/Event inputs to the fusion-siem-bridge webhook URL
documentation: |
  Import playbooks/Custom_Webhook_v1.0.1.yaml for the supported template.
  This file is the same workflow with Fusion SIEM install notes.

  1. Create a Generic Webhook connection.
  2. Set the webhook URL to https://<collector>/v1/ingest?token=<FUSION_SIEM_INGEST_TOKEN>
     Taegis.Webhook.post does not send an Authorization header.
  3. Platform trigger: source Alert2, events Create.
     Filter: `alertSeverity(inputs) >= .6`.
     send-to-webhook.yaml uses `detectionSeverityNice(inputs) in ['High','Critical']`.
  4. POST body is { "alert": inputs.alert2, "events": loop outputs }.
     send-to-webhook.yaml posts the raw trigger inputs instead and does not resolve events.

  See playbooks/Custom Webhook Playbook Template_v1.0.1.pdf
connectorCategories:
  - Generic
connectors:
  - Taegis.Alert:1.2.0
  - Taegis.Event:1.0.10
  - Taegis.Webhook:1.0.0
triggerHints:
  - isProactiveResponse: false
    type: platform
    config:
      events:
        - create
      filter: alertSeverity(inputs) >= 0.6
      source: alert2
inputs:
  type: object
outputs:
  type: object
dsl:
  name: webhook
  tasks:
    - name: loop_over_alert_events
      variables:
        results: []
      range: alertEventIds(inputs)
      for:
        - name: fetch_event_details
          action: Taegis.Event.resolve
          inputs:
            id: loop_over_alert_events.value
    - name: webhook_post
      action: Taegis.Webhook.post
      inputs:
        alert: inputs.alert2
        events: loop_over_alert_events.outputs
type: None
